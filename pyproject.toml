[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rackcheck"
description = "Scan DAW project files and list every plugin used, with links and key info."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
rackcheck = "rackcheck_engine.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rackcheck_engine.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
